<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>推演モード</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #09121e;
      color: #dceaf5;
      font-family: system-ui, sans-serif;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
      background: #101e2c;
      border: 1px solid #35516a;
      border-radius: 4px;
      padding: 8px;
    }

    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #294259;
    }

    h1 { margin: 0; font-size: 20px; }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    #status {
      margin: 0;
      padding: 10px 20px;
      color: #aac6da;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    #status.error { color: #ffbc98; }

    .workspace {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      height: calc(100dvh - 140px);
      min-height: 480px;
    }

    aside {
      padding: 14px;
      overflow-y: auto;
      border-right: 1px solid #294259;
    }

    details {
      margin-bottom: 14px;
      border: 1px solid #294259;
      padding: 10px;
      border-radius: 5px;
    }

    summary {
      cursor: pointer;
      color: #9cdeff;
      margin-bottom: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .note {
      font-size: 12px;
      color: #91adc3;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .unit-entry {
      width: 100%;
      margin-bottom: 8px;
      text-align: left;
    }

    .member-entry {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #07101a;
      touch-action: none;
    }

    #map text {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      paint-order: stroke;
      stroke: #07101a;
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    #preview {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 12px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    @media (max-width: 760px) {
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
      }

      aside {
        max-height: 55dvh;
        border-right: none;
      }

      #map { height: 60dvh; }
    }
  </style>

  <script type="module" src="./simulation-main.js"></script>
</head>

<body>
  <header>
    <h1 id="title">推演モード</h1>

    <div class="toolbar">
      <button id="back" type="button">自定義ページへ戻る</button>
      <button id="fit" type="button">地図全体を表示</button>
      <button id="export" type="button">推演JSONを書き出し</button>
    </div>
  </header>

  <p id="status" role="status" aria-live="polite">
    推演を読み込んでいます…
  </p>

  <main class="workspace">
    <aside>
      <details open>
        <summary>参戦ユニット</summary>
        <div id="units"></div>
        <p id="unitInfo" class="note"></p>
      </details>

      <details>
        <summary>集群・編隊</summary>

        <label>
          <span>名称</span>
          <input id="groupName" value="新しい編隊">
        </label>

        <label>
          <span>種別</span>
          <select id="groupKind">
            <option value="formation">編隊</option>
            <option value="cluster">集群</option>
          </select>
        </label>

        <p class="note">
          選択した個体の所属を新しい編隊へ移します。
          個体の生命・位置・性能は変更しません。
        </p>

        <div id="members"></div>

        <button id="createGroup" type="button">
          選択メンバーで作成
        </button>

        <div id="groups"></div>
      </details>

      <details>
        <summary>行動・記録</summary>

        <p class="note">
          現在は草案のみです。推演ルールが未登録のため、
          移動・命中・傷害・回合進行は実行しません。
        </p>

        <label>
          <span>行動側（個体 / 集群 / 編隊）</span>
          <select id="attacker"></select>
        </label>

        <label>
          <span>目標側（個体 / 集群 / 編隊）</span>
          <select id="target"></select>
        </label>

        <label>
          <span>行動種別</span>
          <select id="actionType">
            <option>攻撃</option>
            <option>防空</option>
            <option>その他の行動</option>
          </select>
        </label>

        <label>
          <span>メモ</span>
          <textarea id="note" maxlength="2000"></textarea>
        </label>

        <div class="buttons">
          <button id="previewAction" type="button">プレビュー</button>
          <button id="saveDraft" type="button">草案を保存</button>
          <button type="button" disabled>ルールに従って実行</button>
        </div>

        <p id="preview"></p>
        <div id="history"></div>
      </details>
    </aside>

    <svg
      id="map"
      viewBox="0 0 1000 650"
      role="img"
      aria-label="推演観察地図。地形とユニットは自由編集できません。"
    >
      <g id="viewport">
        <g id="terrainLayer"></g>
        <g id="unitLayer"></g>
      </g>
    </svg>
  </main>
</body>
</html>
