<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMAシミュレーション計算ツール</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>AMAシミュレーション計算ツール</h1>
    <p>図鑑と参戦状況を共有します。戦闘計算は現時点では行いません。</p>
  </header>

  <main>
    <p id="status" role="status">ユニットデータを読み込み中……</p>

    <nav class="navigation" aria-label="機能モジュール">
      <button type="button" data-view="navy-calculator">海戦計算</button>
      <button type="button" data-view="air-calculator">空戦計算</button>
      <button type="button" data-view="army-calculator">陸戦計算</button>
      <button type="button" data-view="navy-catalog">海戦図鑑</button>
      <button type="button" data-view="air-catalog">空戦図鑑</button>
      <button type="button" data-view="army-catalog">陸戦図鑑</button>
    </nav>

    <section class="panel">
      <h2 id="view-title">機能モジュール</h2>
      <div id="view-content"></div>
    </section>

    <section class="panel">
      <h2>現在の参戦ユニット</h2>
      <p class="muted">
        ここでの状態は6つのモジュールで共有されます。
       在の耐久値を変更しても、図鑑の基本データには影響しません。
      </p>
      <p id="storage-status" class="muted"></p>
      <div id="battle-content"></div>
      <button type="button" id="clear-battle" class="danger">
        現在のシミュレーションをクリア
      </button>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
